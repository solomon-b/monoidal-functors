# NOTE: This should be a good reference for github actions w.r.t haskell
# https://markkarpov.com/post/github-actions-for-haskell-ci.html

name: cabal:build
on:
  push:
    branches:
      - main
  pull_request:
    #branches:
    #  - main
    #types:
    #  - opened
    #  - synchronize

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        cabal: ["3.14"]
        ghc: ["9.2.8", "9.4.8", "9.6.7", "9.8.4", "9.10.3", "9.12.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: haskell-actions/setup@v2
        id: setup-haskell-cabal
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      - name: Freeze
        run: |
          cabal update
          cabal configure --enable-tests --test-show-details=direct
          cabal freeze

      - name: Cache
        uses: actions/cache@v6
        env:
          cache-name: cache-cabal
        with:
          path: |
            ${{ steps.setup-haskell-cabal.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.ghc }}-      

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all

      - name: Haddock
        run: cabal haddock all

      - name: SDist
        run: cabal sdist all

  # doctest acts as the compiler, so the binary must match the GHC it runs
  # against. Building it for the whole matrix is not worth it; the doctests are
  # version-independent, so one GHC covers them.
  doctest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.14"

      - name: Install doctest
        run: |
          cabal update
          cabal install doctest --overwrite-policy=always
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Doctest
        run: cabal repl lib:monoidal-functors --with-compiler=doctest --repl-options=-Wno-type-defaults
